<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            background: #f4f6f8;
        }

        .result-box {
            background: white;
            width: 500px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .prediction {
            font-size: 30px;
            font-weight: bold;
        }

        .confidence {
            font-size: 20px;
            margin-top: 20px;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            text-decoration: none;
            background: #333;
            color: white;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="result-box">

        <h1>Student Prediction Result</h1>

        <div class="prediction">
            {{ prediction }}
        </div>

        <div class="confidence">
            Confidence: {{ confidence }}%
        </div>

        <a href="/">Predict Another Student</a>

    </div>

</body>
</html>
